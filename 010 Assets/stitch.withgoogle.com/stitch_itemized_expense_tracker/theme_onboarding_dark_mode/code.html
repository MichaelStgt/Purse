<!-- Interactive Logic -->
<script>
        function setTheme(theme) {
            const body = document.documentElement;
            const mockup = document.getElementById('preview-mockup');
            const nav = document.getElementById('mock-nav');
            const content = document.getElementById('mock-content');
            const autoReveal = document.getElementById('auto-reveal');
            const glow = document.getElementById('bg-glow');
            const buttons = ['btn-light', 'btn-dark', 'btn-auto'];

            // Update UI State
            buttons.forEach(id => {
                const btn = document.getElementById(id);
                btn.classList.remove('active', 'border-2', 'border-secondary-container', 'shadow-md');
                btn.classList.add('border', 'border-surface-border');
            });

            const activeBtn = document.getElementById(`btn-${theme}`);
            activeBtn.classList.add('active', 'border-2', 'border-secondary-container', 'shadow-md');
            activeBtn.classList.remove('border-surface-border');

            // Apply Transitions
            if (theme === 'light') {
                body.classList.remove('dark');
                mockup.style.backgroundColor = '#ffffff';
                mockup.style.borderColor = '#E2E8F0';
                mockup.style.transform = 'rotateY(-5deg) rotateX(2deg)';
                nav.style.backgroundColor = '#f7f9fb';
                nav.style.borderColor = '#E2E8F0';
                content.style.backgroundColor = '#f7f9fb';
                autoReveal.style.opacity = '0';
                glow.style.backgroundColor = 'rgba(33, 112, 228, 0.05)';
            } else if (theme === 'dark') {
                body.classList.add('dark');
                mockup.style.backgroundColor = '#131b2e';
                mockup.style.borderColor = '#3f465c';
                mockup.style.transform = 'rotateY(5deg) rotateX(2deg)';
                nav.style.backgroundColor = '#131b2e';
                nav.style.borderColor = '#3f465c';
                content.style.backgroundColor = '#0a0f1a';
                autoReveal.style.opacity = '0';
                glow.style.backgroundColor = 'rgba(33, 112, 228, 0.15)';
                // Dark mode mock adjustment
                content.querySelectorAll('div').forEach(d => {
                    if(d.classList.contains('bg-surface-container-highest')) d.style.backgroundColor = 'rgba(255,255,255,0.1)';
                    if(d.classList.contains('bg-surface')) d.style.backgroundColor = 'rgba(255,255,255,0.05)';
                });
            } else {
                // Auto Mode
                body.classList.remove('dark');
                mockup.style.transform = 'rotateY(0deg) rotateX(5deg)';
                autoReveal.style.opacity = '1';
                glow.style.backgroundColor = 'rgba(33, 112, 228, 0.1)';
            }
        }

        // Initialize with Auto
        window.onload = () => setTheme('auto');

        // Micro-interaction: Mouse tracking for mockup
        document.addEventListener('mousemove', (e) => {
            const mockup = document.querySelector('.mockup-inner');
            const xAxis = (window.innerWidth / 2 - e.pageX) / 50;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 50;
            if(!document.getElementById('btn-auto').classList.contains('active')) {
                mockup.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            }
        });
    </script>
