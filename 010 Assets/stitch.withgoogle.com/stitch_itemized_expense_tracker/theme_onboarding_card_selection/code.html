<div class="w-full h-48 bg-white rounded-lg border border-surface-border mb-4 overflow-hidden relative ambient-lift">
<!-- Dashboard Mockup Light -->
<div class="p-3">
<div class="flex items-center justify-between mb-4">
<div class="h-2 w-12 bg-surface-variant rounded"></div>
<div class="h-4 w-4 bg-surface-variant rounded-full"></div>
</div>
<div class="space-y-2">
<div class="h-3 w-3/4 bg-primary-container/10 rounded"></div>

</div>
</div>
</div>
</div>

</button>

<div class="check-badge opacity-0 absolute top-4 right-4 w-6 h-6 bg-secondary-fixed-dim text-primary rounded-full flex items-center justify-center transition-opacity" style="opacity: 0;">

<p class="font-label-caps text-label-caps text-on-surface-variant">Secure &amp; Encrypted Financial Console</p>
</footer>
<script>
        function selectTheme(type) {
            // Remove selection class from all
            document.querySelectorAll('.theme-card').forEach(card => {
                card.classList.remove('theme-card-selected');
                card.querySelector('.check-badge').style.opacity = '0';
            });

            // Add selection to target
            const target = document.getElementById(`card-${type}`);
            target.classList.add('theme-card-selected');
            target.querySelector('.check-badge').style.opacity = '1';

            // Micro-interaction for body class
            if (type === 'dark') {
                document.documentElement.classList.add('dark');
                document.body.classList.remove('bg-surface');
                document.body.classList.add('bg-[#050505]');
            } else {
                document.documentElement.classList.remove('dark');
                document.body.classList.add('bg-surface');
                document.body.classList.remove('bg-[#050505]');
            }
        }
        
        // Initial state
        selectTheme('system');
    </script>
