<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Theme Onboarding - Dark Mode</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Hanken+Grotesk:wght@600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
                "primary": "#8ed5ff",
                "on-background": "#dae2fd",
                "outline": "#87929a",
                "on-error-container": "#ffdad6",
                "on-surface-variant": "#bdc8d1",
                "on-tertiary-fixed": "#111c2d",
                "tertiary-fixed": "#d8e3fb",
                "on-tertiary-container": "#394458",
                "inverse-on-surface": "#283044",
                "surface-container-low": "#131b2e",
                "on-primary-fixed": "#001e2c",
                "inverse-primary": "#00668a",
                "primary-fixed-dim": "#7bd0ff",
                "error": "#ffb4ab",
                "secondary": "#b9c8de",
                "secondary-container": "#39485a",
                "surface-container-lowest": "#060e20",
                "tertiary-container": "#a7b2c9",
                "on-tertiary": "#263143",
                "error-container": "#93000a",
                "tertiary-fixed-dim": "#bcc7de",
                "inverse-surface": "#dae2fd",
                "on-secondary-fixed": "#0d1c2d",
                "on-primary-fixed-variant": "#004c69",
                "tertiary": "#c2cde5",
                "primary-container": "#38bdf8",
                "on-primary-container": "#004965",
                "on-surface": "#dae2fd",
                "on-primary": "#00354a",
                "surface-tint": "#7bd0ff",
                "surface-variant": "#2d3449",
                "surface": "#0b1326",
                "primary-fixed": "#c4e7ff",
                "on-secondary-container": "#a7b6cc",
                "on-secondary-fixed-variant": "#39485a",
                "surface-dim": "#0b1326",
                "surface-container-high": "#222a3d",
                "background": "#0b1326",
                "secondary-fixed-dim": "#b9c8de",
                "secondary-fixed": "#d4e4fa",
                "on-tertiary-fixed-variant": "#3c475a",
                "outline-variant": "#3e484f",
                "on-secondary": "#233143",
                "surface-container": "#171f33",
                "on-error": "#690005",
                "surface-container-highest": "#2d3449",
                "surface-bright": "#31394d"
        },
        "borderRadius": {
                "DEFAULT": "0.125rem",
                "lg": "0.25rem",
                "xl": "0.5rem",
                "full": "0.75rem"
        },
        "spacing": {
                "gutter": "16px",
                "margin-desktop": "32px",
                "container-max": "1280px",
                "unit": "4px",
                "margin-mobile": "16px"
        },
        "fontFamily": {
                "headline-xl": [
                        "Hanken Grotesk"
                ],
                "headline-lg-mobile": [
                        "Hanken Grotesk"
                ],
                "body-sm": [
                        "Inter"
                ],
                "body-md": [
                        "Inter"
                ],
                "headline-lg": [
                        "Hanken Grotesk"
                ],
                "label-mono": [
                        "JetBrains Mono"
                ]
        },
        "fontSize": {
                "headline-xl": [
                        "48px",
                        {
                                "lineHeight": "56px",
                                "letterSpacing": "-0.02em",
                                "fontWeight": "700"
                        }
                ],
                "headline-lg-mobile": [
                        "24px",
                        {
                                "lineHeight": "32px",
                                "fontWeight": "600"
                        }
                ],
                "body-sm": [
                        "14px",
                        {
                                "lineHeight": "20px",
                                "fontWeight": "400"
                        }
                ],
                "body-md": [
                        "16px",
                        {
                                "lineHeight": "24px",
                                "fontWeight": "400"
                        }
                ],
                "headline-lg": [
                        "32px",
                        {
                                "lineHeight": "40px",
                                "letterSpacing": "-0.01em",
                                "fontWeight": "600"
                        }
                ],
                "label-mono": [
                        "12px",
                        {
                                "lineHeight": "16px",
                                "letterSpacing": "0.05em",
                                "fontWeight": "500"
                        }
                ]
        }
},
    },
  }
</script>
<style>
        body {
            min-height: 100dvh;
            background-color: #0b1326;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .selection-indicator {
            font-variation-settings: 'FILL' 1;
        }
        .auto-gradient {
            background: linear-gradient(135deg, #ffffff 50%, #131b2e 50%);
        }
        .active-ring {
            outline: 2px solid theme('colors.primary-container');
            outline-offset: -1px;
        }
    </style>
</head>
<body class="text-on-surface font-body-md selection:bg-primary/30">
<div class="flex flex-col min-h-screen max-w-lg mx-auto px-margin-mobile py-8 md:px-margin-desktop">
<!-- Top App Bar / Logo -->
<header class="flex items-center gap-2 mb-12">
<span class="material-symbols-outlined text-primary text-3xl">account_balance_wallet</span>
<span class="font-headline-lg text-2xl tracking-tighter text-on-surface">Ledger</span>
</header>
<main class="flex-1 flex flex-col gap-10">
<!-- Header Content -->
<section class="space-y-4">
<h1 class="font-headline-xl text-headline-xl text-on-surface leading-tight">Choose your look.</h1>
<p class="text-body-md text-on-surface-variant max-w-xs">
                    Customize your Ledger workspace. High-contrast for focus, dark-mode for comfort, or let us handle it automatically.
                </p>
</section>
<!-- Theme Selector -->
<section class="flex flex-col gap-4">
<!-- Light Option -->
<button class="flex items-center p-5 bg-surface-container-low border border-outline-variant rounded-xl text-left hover:bg-surface-container-high transition-all group" onclick="selectTheme(this)">
<div class="w-14 h-14 rounded-full bg-white flex items-center justify-center mr-4 shrink-0 shadow-sm">
<span class="material-symbols-outlined text-surface-container-lowest text-2xl">light_mode</span>
</div>
<div class="flex-1">
<h3 class="font-headline-lg-mobile text-on-surface">Light</h3>
<p class="text-body-sm text-on-surface-variant">Clean, crisp, and high-visibility.</p>
</div>
<div class="selection-check hidden">
<span class="material-symbols-outlined text-primary-container selection-indicator">check_circle</span>
</div>
</button>
<!-- Dark Option -->
<button class="flex items-center p-5 bg-surface-container border-2 border-primary-container rounded-xl text-left shadow-lg transition-all group active-selection" onclick="selectTheme(this)">
<div class="w-14 h-14 rounded-full bg-surface-container-highest flex items-center justify-center mr-4 shrink-0 shadow-sm">
<span class="material-symbols-outlined text-on-surface text-2xl">dark_mode</span>
</div>
<div class="flex-1">
<h3 class="font-headline-lg-mobile text-on-surface">Dark</h3>
<p class="text-body-sm text-on-surface-variant">Reduce eye strain during late sessions.</p>
</div>
<div class="selection-check block">
<span class="material-symbols-outlined text-primary-container selection-indicator">check_circle</span>
</div>
</button>
<!-- System -->
<button class="flex items-center p-5 bg-surface-container-low border border-outline-variant rounded-xl text-left hover:bg-surface-container-high transition-all group" onclick="selectTheme(this)">
<div class="w-14 h-14 rounded-full auto-gradient border border-outline-variant flex items-center justify-center mr-4 shrink-0 shadow-sm overflow-hidden">
<span class="material-symbols-outlined text-on-surface text-[18px] translate-x-[-1px] translate-y-[-1px]">brightness_6</span>
</div>
<div class="flex-1">
<div class="flex items-center gap-2 mb-1">
<h3 class="font-headline-lg-mobile text-on-surface">System</h3>
<span class="bg-primary-container text-on-primary-container text-[10px] px-2 py-0.5 rounded-full font-bold uppercase tracking-tight">Recommended</span>
</div>
<p class="text-body-sm text-on-surface-variant">Matches your device settings for a seamless experience.</p>
</div>
<div class="selection-check hidden">
<span class="material-symbols-outlined text-primary-container selection-indicator">check_circle</span>
</div>
</button>
</section>
<!-- Actions -->
<section class="mt-auto space-y-6 pb-8">
<button class="w-full h-16 bg-primary-container text-on-primary-container font-headline-lg-mobile rounded-full hover:brightness-110 active:scale-[0.98] transition-all shadow-lg flex items-center justify-center gap-2">
                    Finish Setup
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
<p class="text-center text-label-mono text-outline uppercase tracking-widest">
                    You can change this anytime in Settings.
                </p>
</section>
</main>
</div>
<script>
        function selectTheme(element) {
            // Remove active state from all buttons
            document.querySelectorAll('button').forEach(btn => {
                if (btn.querySelector('.selection-check')) {
                    btn.classList.remove('border-2', 'border-primary-container', 'bg-surface-container', 'shadow-lg', 'active-selection');
                    btn.classList.add('border', 'border-outline-variant', 'bg-surface-container-low');
                    btn.querySelector('.selection-check').classList.add('hidden');
                    btn.querySelector('.selection-check').classList.remove('block');
                }
            });

            // Add active state to clicked button
            element.classList.add('border-2', 'border-primary-container', 'bg-surface-container', 'shadow-lg', 'active-selection');
            element.classList.remove('border', 'border-outline-variant', 'bg-surface-container-low');
            element.querySelector('.selection-check').classList.remove('hidden');
            element.querySelector('.selection-check').classList.add('block');
        }
    </script>


</body></html>
