<style>
        body { transition: background-color 0.5s ease, color 0.5s ease; }
        .theme-card { transition: all 0.2s ease-in-out; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
        .auto-gradient-icon { background: linear-gradient(135deg, #ffffff 50%, #131b2e 50%); }
        .active-card { border-color: theme('colors.secondary-container') !important; border-width: 2px !important; }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-md">
<!-- TopAppBar (Transactional - Suppressed shell) -->
<header class="w-full h-16 flex items-center px-container-padding sticky top-0 bg-surface/80 backdrop-blur-md z-50">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-2xl">account_balance_wallet</span>
<span class="font-display-lg text-headline-md tracking-tighter text-primary">Ledger</span>
</div>
</header>
<main class="flex-1 max-w-lg mx-auto w-full px-container-padding py-stack-lg flex flex-col gap-stack-lg">
<!-- Header Section -->
<div class="space-y-stack-sm">
<h1 class="font-display-lg text-display-lg text-primary leading-[1.1] tracking-tight">Choose your look.</h1>
<p class="font-body-lg text-on-surface-variant">Customize your Ledger workspace. High-contrast for focus, dark-mode for comfort, or let us handle it automatically.</p>
</div>
<!-- Theme Selection Controls -->
<div class="flex flex-col gap-4" id="theme-selector">
<!-- Light Mode Card (Active) -->
<button class="theme-card active-card w-full p-stack-md bg-surface-container-lowest border-2 border-secondary-container rounded-xl text-left flex items-center gap-4 hover:bg-surface-container-low focus:outline-none transition-colors" id="btn-light" onclick="setTheme('light')">
<div class="w-12 h-12 rounded-lg bg-surface-container-low border border-surface-border flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface">light_mode</span>
</div>
<div class="flex-1">
<div class="font-headline-sm text-primary">Light</div>
<div class="text-body-md text-on-surface-variant">Clean, crisp, and high-visibility.</div>
</div>
<div class="check-icon opacity-100">
<span class="material-symbols-outlined text-secondary-container" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
<!-- Dark Mode Card -->
<button class="theme-card w-full p-stack-md bg-surface-container-lowest border border-surface-border rounded-xl text-left flex items-center gap-4 hover:bg-surface-container-low focus:outline-none transition-colors" id="btn-dark" onclick="setTheme('dark')">
<div class="w-12 h-12 rounded-lg bg-primary-container flex items-center justify-center">
<span class="material-symbols-outlined text-white">dark_mode</span>
</div>
<div class="flex-1">
<div class="font-headline-sm text-primary">Dark</div>
<div class="text-body-md text-on-surface-variant">Reduce eye strain during late sessions.</div>
</div>
<div class="check-icon opacity-0">
<span class="material-symbols-outlined text-secondary-container">check_circle</span>
</div>
</button>
<!-- System Mode Card -->
<button class="theme-card w-full p-stack-md bg-surface-container-lowest border border-surface-border rounded-xl text-left flex items-center gap-4 hover:bg-surface-container-low focus:outline-none transition-colors" id="btn-auto" onclick="setTheme('auto')">
<div class="w-12 h-12 rounded-lg auto-gradient-icon border border-surface-border flex items-center justify-center overflow-hidden">
<span class="material-symbols-outlined text-[16px] text-on-surface mix-blend-difference">brightness_6</span>
</div>
<div class="flex-1">
<div class="flex items-center gap-2">
<div class="font-headline-sm text-primary">System</div>
<span class="bg-secondary-container text-white text-[10px] px-2 py-0.5 rounded-full font-bold uppercase tracking-tight">Recommended</span>
</div>
<div class="text-body-md text-on-surface-variant">Matches your device settings for a seamless experience.</div>
</div>
<div class="check-icon opacity-0">
<span class="material-symbols-outlined text-secondary-container">check_circle</span>
</div>
</button>
</div>
<!-- Actions -->
<div class="mt-auto space-y-4">
<button class="w-full py-4 bg-primary text-white font-headline-sm rounded-xl flex items-center justify-center gap-2 hover:opacity-90 active:scale-[0.98] transition-all shadow-lg">
            Continue
<span class="material-symbols-outlined">arrow_forward</span>
</button>
<p class="text-center text-label-caps text-outline uppercase tracking-tight">You can change this anytime in settings.</p>
</div>
</main>
<script>
        function setTheme(theme) {
            const buttons = ['btn-light', 'btn-dark', 'btn-auto'];
            
            buttons.forEach(id => {
                const btn = document.getElementById(id);
                const check = btn.querySelector('.check-icon');
                const checkIcon = check.querySelector('.material-symbols-outlined');
                
                if (id === `btn-${theme}`) {
                    btn.classList.add('active-card');
                    btn.style.borderWidth = '2px';
                    check.classList.remove('opacity-0');
                    check.classList.add('opacity-100');
                    checkIcon.style.fontVariationSettings = "'FILL' 1";
                } else {
                    btn.classList.remove('active-card');
                    btn.style.borderWidth = '1px';
                    check.classList.remove('opacity-100');
                    check.classList.add('opacity-0');
                    checkIcon.style.fontVariationSettings = "'FILL' 0";
                }
            });

            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }
    </script>


</body></html>
